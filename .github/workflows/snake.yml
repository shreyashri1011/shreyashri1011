name: Generate Retro Space Snake Contribution Graph

on:
  schedule:
    # Run automatically every 24 hours
    - cron: "0 0 * * *"
  
  # Allows to manually run the Job at any time
  workflow_dispatch:
  
  # Run on every push on the main branch
  push:
    branches:
    - main
    - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Generates a snake game from a github user's contributions graph, output a SVG animation
      - name: Generate github-contribution-grid-snake.svg
        uses: platane/snk/svg-only@v3
        with:
          github_user_name: "shreyashri1011"
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#F5ECD8&color_dots=#090909,#332E27,#BFAF8E,#D7CFBE,#F5ECD8
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#F5ECD8&color_dots=#090909,#332E27,#BFAF8E,#D7CFBE,#F5ECD8

      # Push the generated files to the repository assets directory
      - name: Push github-contribution-grid-snake.svg to repository
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

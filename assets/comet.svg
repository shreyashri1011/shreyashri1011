<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120" shape-rendering="crispEdges">
  <defs>
    <style>
      .bg { fill: transparent; }
      .p-cream { fill: #F5ECD8; }
      .p-muted { fill: #D7CFBE; }
      .p-accent { fill: #BFAF8E; }

      @keyframes cometShoot {
        0% { transform: translate(-80px, -60px); opacity: 0; }
        15% { opacity: 1; }
        70% { opacity: 1; }
        100% { transform: translate(520px, 140px); opacity: 0; }
      }

      .comet-group {
        animation: cometShoot 6s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
      }
    </style>
  </defs>

  <rect width="500" height="120" class="bg"/>

  <g class="comet-group">
    <!-- Comet Tail Particles (Fading Backwards) -->
    <rect x="0" y="0" width="8" height="8" class="p-accent" opacity="0.2"/>
    <rect x="12" y="6" width="10" height="8" class="p-accent" opacity="0.35"/>
    <rect x="26" y="12" width="12" height="10" class="p-muted" opacity="0.5"/>
    <rect x="42" y="20" width="16" height="12" class="p-muted" opacity="0.7"/>
    <rect x="62" y="30" width="20" height="14" class="p-cream" opacity="0.85"/>

    <!-- Comet Core Head -->
    <rect x="86" y="42" width="18" height="18" class="p-cream"/>
    <rect x="90" y="38" width="14" height="22" class="p-cream"/>
    <rect x="82" y="46" width="22" height="14" class="p-cream"/>

    <!-- Bright Front Tip Spark -->
    <rect x="100" y="52" width="6" height="6" class="p-cream"/>
    <rect x="98" y="50" width="4" height="4" class="p-accent"/>
    <rect x="98" y="56" width="4" height="4" class="p-accent"/>

    <!-- Trail Particles Dispersion -->
    <rect x="18" y="0" width="4" height="4" class="p-accent" opacity="0.4"/>
    <rect x="36" y="8" width="4" height="4" class="p-muted" opacity="0.6"/>
    <rect x="52" y="16" width="4" height="4" class="p-cream" opacity="0.8"/>
  </g>
</svg>

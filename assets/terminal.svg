<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="260" shape-rendering="crispEdges">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=VT323&amp;family=Share+Tech+Mono&amp;display=swap');

      .bg { fill: #090909; stroke: #BFAF8E; stroke-width: 2; }
      .header-bg { fill: #BFAF8E; }
      .header-text { fill: #090909; font-family: 'VT323', 'Courier New', monospace; font-size: 20px; font-weight: bold; letter-spacing: 2px; }
      .term-text { fill: #F5ECD8; font-family: 'Share Tech Mono', 'Courier New', monospace; font-size: 16px; }
      .term-accent { fill: #BFAF8E; font-family: 'Share Tech Mono', 'Courier New', monospace; font-size: 16px; font-weight: bold; }
      .term-muted { fill: #D7CFBE; font-family: 'Share Tech Mono', 'Courier New', monospace; font-size: 14px; }
      .btn-pixel { fill: #090909; }

      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .blinking-cursor {
        animation: cursorBlink 0.9s infinite;
        fill: #F5ECD8;
      }
    </style>
  </defs>

  <g transform="translate(10, 5)">
    <!-- Outer Terminal Chassis Box -->
    <rect x="0" y="0" width="830" height="250" class="bg"/>

    <!-- Terminal Window Header Bar -->
    <rect x="0" y="0" width="830" height="36" class="header-bg"/>

    <!-- Pixel Window Controls (Left Top) -->
    <rect x="16" y="10" width="16" height="16" class="btn-pixel"/>
    <rect x="38" y="10" width="16" height="16" class="btn-pixel"/>
    <rect x="60" y="10" width="16" height="16" class="btn-pixel"/>

    <!-- Window Title -->
    <text x="415" y="24" text-anchor="middle" class="header-text">[ MISSION LOG :: NASA-STATION-09 ]</text>

    <!-- Status Indicator Right Top -->
    <rect x="785" y="12" width="24" height="12" class="btn-pixel"/>
    <rect x="789" y="14" width="16" height="8" fill="#F5ECD8"/>

    <!-- Inner Terminal Screen Content -->
    <!-- Line 1: System Init -->
    <text x="36" y="72" class="term-muted">SYS_INIT &gt; CONNECTED TO SPACE_NET // PROTOCOL_ID: SHREYASHRI1011_0x09</text>

    <!-- Line 2: Prompt Command -->
    <text x="36" y="102" class="term-accent">shreyashri1011@orbit-os:~$ </text>
    <text x="260" y="102" class="term-text">cat current_mission_log.txt</text>

    <!-- Divider Line inside terminal -->
    <line x1="36" y1="116" x2="794" y2="116" stroke="#BFAF8E" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

    <!-- Mission Log Bullet Points -->
    <text x="36" y="142" class="term-accent">[+] CURRENTLY BUILDING &amp; RESEARCHING:</text>

    <text x="68" y="172" class="term-text">• Machine Learning</text>
    <text x="440" y="172" class="term-muted">[ Deep Learning &amp; Neural Nets ]</text>

    <text x="68" y="200" class="term-text">• Cybersecurity Implementation</text>
    <text x="440" y="200" class="term-muted">[ Network Defense &amp; Encryption ]</text>

    <text x="68" y="228" class="term-text">• DSA</text>
    <text x="440" y="228" class="term-muted">[ High-Performance Algorithms ]</text>

    <!-- Blinking Cursor after text -->
    <rect x="135" y="214" width="10" height="18" class="blinking-cursor"/>
  </g>
</svg>

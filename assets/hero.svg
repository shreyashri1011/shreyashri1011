<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="480" shape-rendering="crispEdges" overflow="visible">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=VT323&amp;family=Share+Tech+Mono&amp;display=swap');

      .bg { fill: #090909; }
      .p-cream { fill: #F5ECD8; }
      .p-muted { fill: #D7CFBE; }
      .p-accent { fill: #BFAF8E; }
      .p-dark { fill: #090909; }

      .hero-title { font-family: 'VT323', monospace; font-size: 54px; fill: #F5ECD8; letter-spacing: 4px; }
      .hero-sub { font-family: 'VT323', monospace; font-size: 32px; fill: #BFAF8E; letter-spacing: 3px; }
      .hero-badges { font-family: 'Share Tech Mono', monospace; font-size: 14px; fill: #D7CFBE; letter-spacing: 2px; }
      .terminal-prompt { font-family: 'Share Tech Mono', monospace; font-size: 15px; fill: #BFAF8E; }

      /* CONTROLLED SAFE FLOAT ANIMATION (NO TOP CLIPPING) */
      @keyframes floatAstronautSafe {
        0%, 100% { transform: translateY(0px) translateX(0px) rotate(0deg); }
        33% { transform: translateY(-14px) translateX(6px) rotate(2deg); }
        66% { transform: translateY(8px) translateX(-4px) rotate(-1.5deg); }
      }

      @keyframes waveHand {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-24deg); }
        50% { transform: rotate(-4deg); }
        75% { transform: rotate(-24deg); }
      }

      @keyframes saturnFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      @keyframes starTwinkle {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }

      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      @keyframes pulseBoxGlow {
        0%, 100% { stroke: #BFAF8E; stroke-width: 2; }
        50% { stroke: #F5ECD8; stroke-width: 2.5; }
      }

      .astro-group {
        animation: floatAstronautSafe 6s ease-in-out infinite;
        transform-origin: center;
      }

      .arm-wave {
        animation: waveHand 4s ease-in-out infinite;
        transform-origin: 660px 185px;
      }

      .saturn-anim {
        animation: saturnFloat 8s ease-in-out infinite;
      }

      .twinkle-1 { animation: starTwinkle 2.1s infinite; }
      .twinkle-2 { animation: starTwinkle 3.5s infinite 0.7s; }
      .twinkle-3 { animation: starTwinkle 1.8s infinite 1.2s; }
      .cursor { animation: cursorBlink 0.9s infinite; fill: #F5ECD8; }
      .pulse-border { animation: pulseBoxGlow 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Deep Space Void Background -->
  <rect width="850" height="480" class="bg"/>

  <!-- Twinkling Pixel Starfield -->
  <g class="twinkle-1">
    <rect x="50" y="50" width="4" height="4" class="p-cream"/>
    <rect x="420" y="40" width="3" height="3" class="p-accent"/>
    <rect x="790" y="80" width="4" height="4" class="p-cream"/>
    <rect x="300" y="420" width="4" height="4" class="p-muted"/>
  </g>
  <g class="twinkle-2">
    <rect x="180" y="100" width="3" height="3" class="p-accent"/>
    <rect x="520" y="60" width="4" height="4" class="p-cream"/>
    <rect x="110" y="380" width="3" height="3" class="p-cream"/>
    <rect x="740" y="370" width="4" height="4" class="p-accent"/>
  </g>
  <g class="twinkle-3">
    <rect x="340" y="130" width="4" height="4" class="p-muted"/>
    <rect x="620" y="410" width="3" height="3" class="p-cream"/>
    <rect x="30" y="280" width="4" height="4" class="p-accent"/>
  </g>

  <!-- Animated Saturn in Background Top Left -->
  <g transform="translate(35, 30) scale(0.6)" class="saturn-anim" opacity="0.8">
    <path d="M 20 60 H 130 V 68 H 20 Z" class="p-accent"/>
    <rect x="56" y="36" width="48" height="56" class="p-cream"/>
    <rect x="52" y="48" width="56" height="4" class="p-accent"/>
    <rect x="48" y="60" width="64" height="4" class="p-muted"/>
  </g>

  <!-- Left Side: Terminal NASA Greeting OS -->
  <g transform="translate(45, 110)">
    <!-- OS Tag -->
    <text x="0" y="20" class="terminal-prompt">&gt; INITIALIZING ORBIT_OS v1.0.4 ... [ONLINE]</text>
    <line x1="0" y1="32" x2="470" y2="32" stroke="#BFAF8E" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>

    <!-- HELLO. I'M SHREYA. -->
    <text x="0" y="80" class="hero-sub">HELLO.</text>
    <text x="0" y="135" class="hero-title">I'M SHREYA<tspan class="cursor">_</tspan></text>

    <!-- DOMAINS GRID BOX -->
    <g transform="translate(0, 165)">
      <rect x="0" y="0" width="470" height="92" fill="#090909" class="pulse-border"/>
      <rect x="0" y="0" width="470" height="24" fill="#BFAF8E"/>
      <text x="12" y="17" font-family="'VT323', monospace" font-size="16" fill="#090909" font-weight="bold">[ CORE MISSION DOMAINS ]</text>

      <text x="16" y="52" class="hero-badges">AI  •  CYBERSECURITY</text>
      <text x="16" y="75" class="hero-badges">UI/UX DESIGN  •  APP DEV</text>

      <!-- Status dot -->
      <rect x="440" y="52" width="12" height="12" class="p-cream"/>
    </g>
  </g>

  <!-- Right Side: Pixel Mascot Astronaut (Shifted down and right to prevent ANY top clipping or left text overlap) -->
  <g class="astro-group" transform="translate(570, 120)">
    <!-- Backpack -->
    <rect x="30" y="60" width="16" height="60" class="p-muted"/>
    
    <!-- Torso -->
    <rect x="46" y="55" width="70" height="75" class="p-cream"/>
    <!-- Suit Details -->
    <rect x="62" y="70" width="38" height="28" class="p-muted"/>
    <rect x="68" y="75" width="10" height="10" class="p-accent"/>
    <rect x="84" y="75" width="10" height="10" class="p-dark"/>

    <!-- Helmet Structure -->
    <rect x="42" y="10" width="78" height="50" class="p-cream"/>
    <!-- Visor -->
    <rect x="52" y="16" width="58" height="34" class="p-accent"/>
    <rect x="56" y="20" width="50" height="26" class="p-dark"/>
    <!-- Reflection -->
    <rect x="60" y="24" width="14" height="6" class="p-cream"/>

    <!-- Left Arm -->
    <rect x="26" y="70" width="20" height="40" class="p-cream"/>
    <rect x="20" y="100" width="16" height="16" class="p-accent"/>

    <!-- Waving Right Arm -->
    <g class="arm-wave">
      <rect x="116" y="65" width="24" height="14" class="p-cream"/>
      <rect x="130" y="35" width="16" height="35" class="p-cream"/>
      <rect x="126" y="20" width="20" height="18" class="p-accent"/>
      <!-- Fingers -->
      <rect x="122" y="14" width="6" height="10" class="p-cream"/>
      <rect x="132" y="10" width="6" height="12" class="p-cream"/>
      <rect x="142" y="14" width="6" height="10" class="p-cream"/>
    </g>

    <!-- Legs & Boots -->
    <rect x="54" y="130" width="24" height="40" class="p-cream"/>
    <rect x="48" y="160" width="30" height="18" class="p-accent"/>

    <rect x="86" y="130" width="24" height="40" class="p-cream"/>
    <rect x="86" y="160" width="30" height="18" class="p-accent"/>
  </g>
</svg>

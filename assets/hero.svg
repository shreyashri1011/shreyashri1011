<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="220" shape-rendering="crispEdges">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=VT323&amp;family=Share+Tech+Mono&amp;display=swap');

      .bg { fill: #090909; }
      .p-cream { fill: #F5ECD8; }
      .p-muted { fill: #D7CFBE; }
      .p-accent { fill: #BFAF8E; }

      .hero-title { font-family: 'VT323', monospace; font-size: 58px; fill: #F5ECD8; letter-spacing: 6px; }
      .hero-sub { font-family: 'VT323', monospace; font-size: 30px; fill: #BFAF8E; letter-spacing: 4px; }
      .hero-badges { font-family: 'Share Tech Mono', monospace; font-size: 15px; fill: #D7CFBE; letter-spacing: 3px; }
      .terminal-prompt { font-family: 'Share Tech Mono', monospace; font-size: 14px; fill: #BFAF8E; }

      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .cursor { animation: cursorBlink 0.9s infinite; fill: #F5ECD8; }
    </style>
  </defs>

  <rect width="850" height="220" class="bg"/>

  <!-- Centered Terminal OS Greeting Banner -->
  <g transform="translate(0, 20)">
    <!-- Terminal OS Tag -->
    <text x="425" y="24" text-anchor="middle" class="terminal-prompt">&gt; INITIALIZING ORBIT_OS v1.0.4 ... [ONLINE]</text>
    <line x1="220" y1="36" x2="630" y2="36" stroke="#BFAF8E" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

    <!-- HELLO. I'M SHREYA. -->
    <text x="425" y="80" text-anchor="middle" class="hero-sub">HELLO.</text>
    <text x="425" y="138" text-anchor="middle" class="hero-title">I'M SHREYA<tspan class="cursor">_</tspan></text>

    <!-- CORE MISSION DOMAINS BAR -->
    <text x="425" y="180" text-anchor="middle" class="hero-badges">AI   •   CYBERSECURITY   •   UI/UX DESIGN   •   APP DEV</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="240" shape-rendering="crispEdges">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=VT323&amp;family=Share+Tech+Mono&amp;display=swap');

      .bg { fill: #090909; stroke: #BFAF8E; stroke-width: 2; }
      .box-bg { fill: #090909; stroke: #BFAF8E; stroke-width: 1.5; }
      .stat-num { font-family: 'VT323', monospace; font-size: 34px; fill: #F5ECD8; }
      .stat-label { font-family: 'Share Tech Mono', monospace; font-size: 11px; fill: #D7CFBE; letter-spacing: 1px; }
      .stat-title { font-family: 'VT323', monospace; font-size: 19px; fill: #BFAF8E; letter-spacing: 2px; }
      .lang-name { font-family: 'Share Tech Mono', monospace; font-size: 13px; fill: #F5ECD8; }
      .lang-pct { font-family: 'Share Tech Mono', monospace; font-size: 12px; fill: #BFAF8E; }

      @keyframes pulseLed {
        0%, 100% { fill: #F5ECD8; opacity: 1; }
        50% { fill: #BFAF8E; opacity: 0.3; }
      }

      .led-blink {
        animation: pulseLed 1.2s infinite;
      }
    </style>
  </defs>

  <rect width="850" height="240" fill="#090909"/>

  <!-- Left Card: Orbit Statistics -->
  <g transform="translate(10, 5)">
    <rect x="0" y="0" width="405" height="225" class="bg"/>
    
    <!-- Title Bar -->
    <rect x="0" y="0" width="405" height="32" fill="#BFAF8E"/>
    <text x="14" y="22" font-family="'VT323', monospace" font-size="17" fill="#090909" font-weight="bold">[ TELEMETRY // STATS OVERVIEW ]</text>
    <rect x="378" y="10" width="12" height="12" class="led-blink"/>

    <!-- Stat 1: Total Commits/Contributions -->
    <g transform="translate(20, 55)">
      <text x="0" y="32" class="stat-num">120+</text>
      <text x="0" y="52" class="stat-label">TOTAL CONTRIBUTIONS</text>
    </g>

    <!-- Vertical Divider -->
    <line x1="195" y1="50" x2="195" y2="135" stroke="#BFAF8E" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>

    <!-- Stat 2: Streak -->
    <g transform="translate(210, 55)">
      <text x="0" y="32" class="stat-num">27 DAYS</text>
      <text x="0" y="52" class="stat-label">CURRENT ORBIT STREAK</text>
    </g>
  </g>
</svg>

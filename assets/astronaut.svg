<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 250" width="220" height="250" shape-rendering="crispEdges" overflow="visible">
  <defs>
    <style>
      .bg { fill: transparent; }
      .p-cream { fill: #F5ECD8; }
      .p-muted { fill: #D7CFBE; }
      .p-accent { fill: #BFAF8E; }
      .p-dark { fill: #090909; }
      .p-star { fill: #F5ECD8; }

      @keyframes floatAstronautControlled {
        0%, 100% { transform: translateY(0px) translateX(0px) rotate(0deg); }
        33% { transform: translateY(-12px) translateX(6px) rotate(2deg); }
        66% { transform: translateY(6px) translateX(-4px) rotate(-1.5deg); }
      }

      @keyframes waveArm {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-24deg); }
        50% { transform: rotate(-4deg); }
        75% { transform: rotate(-24deg); }
      }

      @keyframes twinkle {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }

      .floating-group {
        animation: floatAstronautControlled 6s ease-in-out infinite;
        transform-origin: center;
      }

      .waving-arm {
        animation: waveArm 4s ease-in-out infinite;
        transform-origin: 74px 112px;
      }

      .star-1 { animation: twinkle 2.3s ease-in-out infinite; }
      .star-2 { animation: twinkle 3.7s ease-in-out infinite 0.8s; }
      .star-3 { animation: twinkle 1.9s ease-in-out infinite 1.4s; }
    </style>
  </defs>

  <rect width="220" height="250" class="bg"/>

  <!-- Pixel Background Stars -->
  <g class="star-1">
    <rect x="24" y="40" width="4" height="4" class="p-star"/>
    <rect x="24" y="36" width="4" height="4" class="p-accent"/>
    <rect x="20" y="40" width="4" height="4" class="p-accent"/>
    <rect x="28" y="40" width="4" height="4" class="p-accent"/>
  </g>
  <g class="star-2">
    <rect x="180" y="55" width="4" height="4" class="p-star"/>
    <rect x="176" y="55" width="4" height="4" class="p-muted"/>
    <rect x="184" y="55" width="4" height="4" class="p-muted"/>
  </g>

  <!-- Astronaut Main Floating Group (Shifted down to y=24 for ample top safety margin) -->
  <g transform="translate(10, 24)">
    <g class="floating-group">
      <!-- Life Support Backpack -->
      <rect x="52" y="72" width="16" height="56" class="p-muted"/>
      <rect x="48" y="76" width="24" height="48" class="p-muted"/>
      <rect x="44" y="80" width="4" height="40" class="p-accent"/>

      <!-- Left Arm & Oxygen Hose -->
      <rect x="56" y="96" width="8" height="24" class="p-cream"/>
      <rect x="52" y="112" width="8" height="12" class="p-muted"/>

      <!-- Body Torso -->
      <rect x="68" y="76" width="64" height="52" class="p-cream"/>
      <rect x="72" y="72" width="56" height="60" class="p-cream"/>
      
      <!-- Torso Suit Details / Control Panel -->
      <rect x="84" y="88" width="32" height="24" class="p-muted"/>
      <rect x="88" y="92" width="8" height="8" class="p-accent"/>
      <rect x="100" y="92" width="8" height="8" class="p-dark"/>
      <rect x="88" y="104" width="20" height="4" class="p-dark"/>

      <!-- Helmet Outer Structure -->
      <rect x="68" y="28" width="64" height="48" class="p-cream"/>
      <rect x="64" y="32" width="72" height="40" class="p-cream"/>
      <rect x="72" y="24" width="56" height="56" class="p-cream"/>

      <!-- Visor Frame (Accent) -->
      <rect x="76" y="32" width="48" height="32" class="p-accent"/>
      <rect x="72" y="36" width="56" height="24" class="p-accent"/>

      <!-- Visor Glass (Dark Void) -->
      <rect x="80" y="36" width="40" height="24" class="p-dark"/>
      <rect x="76" y="40" width="48" height="16" class="p-dark"/>

      <!-- Visor Reflection Highlight -->
      <rect x="84" y="40" width="12" height="4" class="p-cream"/>
      <rect x="80" y="44" width="8" height="4" class="p-cream"/>
      <rect x="116" y="48" width="4" height="4" class="p-accent"/>

      <!-- Legs & Boots -->
      <!-- Left Leg -->
      <rect x="76" y="128" width="20" height="32" class="p-cream"/>
      <rect x="72" y="152" width="24" height="16" class="p-muted"/>
      <rect x="68" y="160" width="28" height="12" class="p-accent"/>
      <!-- Right Leg -->
      <rect x="104" y="128" width="20" height="32" class="p-cream"/>
      <rect x="104" y="152" width="24" height="16" class="p-muted"/>
      <rect x="104" y="160" width="28" height="12" class="p-accent"/>

      <!-- Interactive Waving Right Arm -->
      <g class="waving-arm">
        <!-- Upper Arm -->
        <rect x="128" y="80" width="20" height="12" class="p-cream"/>
        <!-- Forearm extending upwards -->
        <rect x="140" y="60" width="12" height="24" class="p-cream"/>
        <!-- Glove -->
        <rect x="136" y="48" width="16" height="16" class="p-accent"/>
        <rect x="132" y="52" width="8" height="8" class="p-cream"/>
        <rect x="148" y="44" width="4" height="8" class="p-accent"/>
        <rect x="140" y="44" width="4" height="8" class="p-accent"/>
      </g>

      <!-- Floating Tether Line behind astronaut -->
      <rect x="36" y="116" width="12" height="4" class="p-accent"/>
      <rect x="24" y="120" width="16" height="4" class="p-accent"/>
      <rect x="12" y="124" width="16" height="4" class="p-muted"/>
      <rect x="0" y="128" width="16" height="4" class="p-muted"/>
    </g>
  </g>
</svg>

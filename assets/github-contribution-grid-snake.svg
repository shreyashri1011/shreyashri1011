<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 170" width="100%" height="170" shape-rendering="crispEdges">
  <defs>
    <style>
      .bg { fill: #090909; }
      .grid-dot-0 { fill: #161616; }
      .grid-dot-1 { fill: #332E27; }
      .grid-dot-2 { fill: #BFAF8E; }
      .grid-dot-3 { fill: #D7CFBE; }
      .grid-dot-4 { fill: #F5ECD8; }

      @keyframes snakeMove {
        0% { transform: translate(0px, 0px); }
        20% { transform: translate(120px, 0px); }
        40% { transform: translate(240px, 30px); }
        60% { transform: translate(380px, 15px); }
        80% { transform: translate(540px, 45px); }
        100% { transform: translate(720px, 15px); }
      }

      .snake-head {
        animation: snakeMove 10s linear infinite alternate;
      }
    </style>
  </defs>

  <rect width="850" height="170" class="bg"/>

  <!-- Border Box -->
  <rect x="5" y="5" width="840" height="160" fill="#090909" stroke="#BFAF8E" stroke-width="2"/>

  <!-- Matrix Contribution Grid Dots (53 Weeks x 7 Days Grid) -->
  <g transform="translate(25, 20)">
    <!-- Generated Pixel Contribution Grid Pattern -->
    <rect x="0" y="0" width="10" height="10" class="grid-dot-1"/>
    <rect x="0" y="15" width="10" height="10" class="grid-dot-0"/>
    <rect x="0" y="30" width="10" height="10" class="grid-dot-2"/>
    <rect x="0" y="45" width="10" height="10" class="grid-dot-0"/>
    <rect x="0" y="60" width="10" height="10" class="grid-dot-1"/>

    <rect x="15" y="0" width="10" height="10" class="grid-dot-0"/>
    <rect x="15" y="15" width="10" height="10" class="grid-dot-3"/>
    <rect x="15" y="30" width="10" height="10" class="grid-dot-1"/>
    <rect x="15" y="45" width="10" height="10" class="grid-dot-4"/>
    <rect x="15" y="60" width="10" height="10" class="grid-dot-0"/>

    <rect x="30" y="0" width="10" height="10" class="grid-dot-2"/>
    <rect x="30" y="15" width="10" height="10" class="grid-dot-0"/>
    <rect x="30" y="30" width="10" height="10" class="grid-dot-1"/>
    <rect x="30" y="45" width="10" height="10" class="grid-dot-2"/>
    <rect x="30" y="60" width="10" height="10" class="grid-dot-3"/>

    <!-- Repeating Grid across columns for visual fullness -->
    <!-- Col Group 1 -->
    <g transform="translate(45, 0)">
      <rect x="0" y="0" width="10" height="10" class="grid-dot-4"/><rect x="0" y="15" width="10" height="10" class="grid-dot-2"/>
      <rect x="0" y="30" width="10" height="10" class="grid-dot-0"/><rect x="0" y="45" width="10" height="10" class="grid-dot-3"/>
      <rect x="15" y="0" width="10" height="10" class="grid-dot-1"/><rect x="15" y="15" width="10" height="10" class="grid-dot-4"/>
      <rect x="15" y="30" width="10" height="10" class="grid-dot-2"/><rect x="15" y="45" width="10" height="10" class="grid-dot-0"/>
    </g>

    <g transform="translate(90, 0)">
      <rect x="0" y="0" width="10" height="10" class="grid-dot-2"/><rect x="0" y="15" width="10" height="10" class="grid-dot-0"/>
      <rect x="0" y="30" width="10" height="10" class="grid-dot-3"/><rect x="0" y="45" width="10" height="10" class="grid-dot-4"/>
      <rect x="15" y="0" width="10" height="10" class="grid-dot-1"/><rect x="15" y="15" width="10" height="10" class="grid-dot-2"/>
      <rect x="30" y="0" width="10" height="10" class="grid-dot-4"/><rect x="30" y="15" width="10" height="10" class="grid-dot-3"/>
    </g>

    <g transform="translate(150, 0)">
      <rect x="0" y="0" width="10" height="10" class="grid-dot-1"/><rect x="0" y="15" width="10" height="10" class="grid-dot-3"/>
      <rect x="0" y="30" width="10" height="10" class="grid-dot-4"/><rect x="0" y="45" width="10" height="10" class="grid-dot-2"/>
      <rect x="15" y="0" width="10" height="10" class="grid-dot-0"/><rect x="15" y="15" width="10" height="10" class="grid-dot-1"/>
      <rect x="30" y="0" width="10" height="10" class="grid-dot-2"/><rect x="30" y="15" width="10" height="10" class="grid-dot-4"/>
    </g>

    <g transform="translate(220, 0)">
      <rect x="0" y="0" width="10" height="10" class="grid-dot-3"/><rect x="0" y="15" width="10" height="10" class="grid-dot-2"/>
      <rect x="0" y="30" width="10" height="10" class="grid-dot-1"/><rect x="0" y="45" width="10" height="10" class="grid-dot-4"/>
      <rect x="15" y="0" width="10" height="10" class="grid-dot-4"/><rect x="15" y="15" width="10" height="10" class="grid-dot-0"/>
      <rect x="30" y="0" width="10" height="10" class="grid-dot-1"/><rect x="30" y="15" width="10" height="10" class="grid-dot-3"/>
    </g>

    <g transform="translate(300, 0)">
      <rect x="0" y="0" width="10" height="10" class="grid-dot-2"/><rect x="0" y="15" width="10" height="10" class="grid-dot-4"/>
      <rect x="0" y="30" width="10" height="10" class="grid-dot-0"/><rect x="0" y="45" width="10" height="10" class="grid-dot-1"/>
      <rect x="15" y="0" width="10" height="10" class="grid-dot-3"/><rect x="15" y="15" width="10" height="10" class="grid-dot-2"/>
      <rect x="30" y="0" width="10" height="10" class="grid-dot-4"/><rect x="30" y="15" width="10" height="10" class="grid-dot-1"/>
    </g>

    <g transform="translate(380, 0)">
      <rect x="0" y="0" width="10" height="10" class="grid-dot-1"/><rect x="0" y="15" width="10" height="10" class="grid-dot-3"/>
      <rect x="0" y="30" width="10" height="10" class="grid-dot-4"/><rect x="0" y="45" width="10" height="10" class="grid-dot-2"/>
      <rect x="15" y="0" width="10" height="10" class="grid-dot-0"/><rect x="15" y="15" width="10" height="10" class="grid-dot-4"/>
      <rect x="30" y="0" width="10" height="10" class="grid-dot-2"/><rect x="30" y="15" width="10" height="10" class="grid-dot-3"/>
    </g>

    <g transform="translate(460, 0)">
      <rect x="0" y="0" width="10" height="10" class="grid-dot-4"/><rect x="0" y="15" width="10" height="10" class="grid-dot-2"/>
      <rect x="0" y="30" width="10" height="10" class="grid-dot-1"/><rect x="0" y="45" width="10" height="10" class="grid-dot-3"/>
      <rect x="15" y="0" width="10" height="10" class="grid-dot-0"/><rect x="15" y="15" width="10" height="10" class="grid-dot-1"/>
      <rect x="30" y="0" width="10" height="10" class="grid-dot-3"/><rect x="30" y="15" width="10" height="10" class="grid-dot-4"/>
    </g>

    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="10" height="10" class="grid-dot-2"/><rect x="0" y="15" width="10" height="10" class="grid-dot-4"/>
      <rect x="0" y="30" width="10" height="10" class="grid-dot-0"/><rect x="0" y="45" width="10" height="10" class="grid-dot-1"/>
      <rect x="15" y="0" width="10" height="10" class="grid-dot-3"/><rect x="15" y="15" width="10" height="10" class="grid-dot-2"/>
      <rect x="30" y="0" width="10" height="10" class="grid-dot-1"/><rect x="30" y="15" width="10" height="10" class="grid-dot-4"/>
    </g>

    <g transform="translate(620, 0)">
      <rect x="0" y="0" width="10" height="10" class="grid-dot-3"/><rect x="0" y="15" width="10" height="10" class="grid-dot-1"/>
      <rect x="0" y="30" width="10" height="10" class="grid-dot-4"/><rect x="0" y="45" width="10" height="10" class="grid-dot-2"/>
      <rect x="15" y="0" width="10" height="10" class="grid-dot-0"/><rect x="15" y="15" width="10" height="10" class="grid-dot-3"/>
      <rect x="30" y="0" width="10" height="10" class="grid-dot-2"/><rect x="30" y="15" width="10" height="10" class="grid-dot-4"/>
    </g>

    <g transform="translate(700, 0)">
      <rect x="0" y="0" width="10" height="10" class="grid-dot-4"/><rect x="0" y="15" width="10" height="10" class="grid-dot-2"/>
      <rect x="0" y="30" width="10" height="10" class="grid-dot-1"/><rect x="0" y="45" width="10" height="10" class="grid-dot-3"/>
      <rect x="15" y="0" width="10" height="10" class="grid-dot-0"/><rect x="15" y="15" width="10" height="10" class="grid-dot-1"/>
      <rect x="30" y="0" width="10" height="10" class="grid-dot-3"/><rect x="30" y="15" width="10" height="10" class="grid-dot-4"/>
    </g>

    <!-- Animated Pixel Contribution Snake -->
    <g class="snake-head">
      <rect x="0" y="30" width="12" height="12" fill="#F5ECD8"/>
      <rect x="-12" y="30" width="10" height="10" fill="#BFAF8E"/>
      <rect x="-22" y="30" width="8" height="8" fill="#D7CFBE"/>
      <rect x="2" y="32" width="2" height="2" fill="#090909"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 48" width="100%" height="48" shape-rendering="crispEdges">
  <defs>
    <style>
      .bg { fill: transparent; }
      .p-cream { fill: #F5ECD8; }
      .p-muted { fill: #D7CFBE; }
      .p-accent { fill: #BFAF8E; }
      .p-dark { fill: #090909; }

      @keyframes orbitSat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes blinkSignal {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }

      .satellite-anim {
        animation: orbitSat 3s ease-in-out infinite;
      }
      .signal-anim {
        animation: blinkSignal 1.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="800" height="48" class="bg"/>

  <!-- Horizontal Pixel Divider Rail -->
  <line x1="20" y1="24" x2="350" y2="24" stroke="#BFAF8E" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>
  <line x1="450" y1="24" x2="780" y2="24" stroke="#BFAF8E" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Left Star Cluster -->
  <rect x="60" y="22" width="5" height="5" class="p-cream"/>
  <rect x="180" y="21" width="6" height="6" class="p-accent"/>
  <rect x="280" y="22" width="5" height="5" class="p-muted"/>

  <!-- Right Star Cluster -->
  <rect x="520" y="22" width="5" height="5" class="p-muted"/>
  <rect x="620" y="21" width="6" height="6" class="p-accent"/>
  <rect x="740" y="22" width="5" height="5" class="p-cream"/>

  <!-- Center Feature: Pixel Satellite & Transmission Waves -->
  <g transform="translate(370, 8)">
    <g class="satellite-anim">
      <!-- Solar Panels Left -->
      <rect x="0" y="10" width="16" height="12" class="p-muted"/>
      <rect x="2" y="12" width="5" height="8" class="p-dark"/>
      <rect x="9" y="12" width="5" height="8" class="p-dark"/>

      <!-- Panel Connector Left -->
      <rect x="16" y="14" width="6" height="4" class="p-accent"/>

      <!-- Main Satellite Bus Chassis -->
      <rect x="22" y="8" width="16" height="16" class="p-cream"/>
      <rect x="24" y="10" width="12" height="12" class="p-accent"/>

      <!-- Panel Connector Right -->
      <rect x="38" y="14" width="6" height="4" class="p-accent"/>

      <!-- Solar Panels Right -->
      <rect x="44" y="10" width="16" height="12" class="p-muted"/>
      <rect x="46" y="12" width="5" height="8" class="p-dark"/>
      <rect x="53" y="12" width="5" height="8" class="p-dark"/>

      <!-- Dish Antenna -->
      <rect x="28" y="24" width="4" height="6" class="p-accent"/>
      <path d="M 22 30 H 38 V 32 H 22 Z" class="p-cream"/>
    </g>

    <!-- Signal Pulses emitting downwards -->
    <g class="signal-anim">
      <rect x="28" y="34" width="4" height="2" class="p-cream"/>
      <rect x="26" y="38" width="8" height="2" class="p-accent"/>
    </g>
  </g>
</svg>

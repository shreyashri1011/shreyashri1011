<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="120" shape-rendering="crispEdges">
  <defs>
    <style>
      .bg { fill: #090909; }
      .p-cream { fill: #F5ECD8; }
      .p-muted { fill: #D7CFBE; }
      .p-accent { fill: #BFAF8E; }
      
      @keyframes twinkleFast {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
      @keyframes twinkleSlow {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 0.2; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.1); }
      }

      .t-1 { animation: twinkleFast 2s ease-in-out infinite; }
      .t-2 { animation: twinkleFast 3.4s ease-in-out infinite 0.7s; }
      .t-3 { animation: twinkleSlow 4.1s ease-in-out infinite 1.2s; }
      .t-4 { animation: twinkleFast 2.8s ease-in-out infinite 1.9s; }
      
      .constellation-line { stroke: #BFAF8E; stroke-width: 1; stroke-dasharray: 2 2; opacity: 0.35; }
    </style>
  </defs>

  <rect width="800" height="120" class="bg"/>

  <!-- Constellation 1: Ursa Major style pixel nodes -->
  <line x1="80" y1="30" x2="130" y2="45" class="constellation-line"/>
  <line x1="130" y1="45" x2="170" y2="35" class="constellation-line"/>
  <line x1="170" y1="35" x2="220" y2="60" class="constellation-line"/>
  <line x1="220" y1="60" x2="210" y2="90" class="constellation-line"/>
  <line x1="210" y1="90" x2="270" y2="85" class="constellation-line"/>
  <line x1="270" y1="85" x2="260" y2="55" class="constellation-line"/>
  <line x1="260" y1="55" x2="220" y2="60" class="constellation-line"/>

  <!-- Constellation Nodes -->
  <rect x="78" y="28" width="5" height="5" class="p-cream t-1"/>
  <rect x="128" y="43" width="5" height="5" class="p-cream t-2"/>
  <rect x="168" y="33" width="5" height="5" class="p-accent t-3"/>
  <rect x="218" y="58" width="5" height="5" class="p-cream t-1"/>
  <rect x="208" y="88" width="5" height="5" class="p-muted t-4"/>
  <rect x="268" y="83" width="5" height="5" class="p-cream t-2"/>
  <rect x="258" y="53" width="5" height="5" class="p-accent t-3"/>

  <!-- Constellation 2: Cassiopeia style pixel nodes right side -->
  <line x1="580" y1="25" x2="620" y2="55" class="constellation-line"/>
  <line x1="620" y1="55" x2="660" y2="35" class="constellation-line"/>
  <line x1="660" y1="35" x2="710" y2="65" class="constellation-line"/>
  <line x1="710" y1="65" x2="750" y2="40" class="constellation-line"/>

  <rect x="578" y="23" width="5" height="5" class="p-cream t-3"/>
  <rect x="618" y="53" width="5" height="5" class="p-accent t-1"/>
  <rect x="658" y="33" width="5" height="5" class="p-cream t-4"/>
  <rect x="708" y="63" width="5" height="5" class="p-muted t-2"/>
  <rect x="748" y="38" width="5" height="5" class="p-cream t-1"/>

  <!-- Scattered Twinkling Stars -->
  <!-- Cross Stars -->
  <g class="t-1">
    <rect x="420" y="20" width="3" height="3" class="p-cream"/>
    <rect x="420" y="17" width="3" height="3" class="p-accent"/>
    <rect x="417" y="20" width="3" height="3" class="p-accent"/>
    <rect x="423" y="20" width="3" height="3" class="p-accent"/>
    <rect x="420" y="23" width="3" height="3" class="p-accent"/>
  </g>

  <g class="t-3">
    <rect x="340" y="75" width="3" height="3" class="p-cream"/>
    <rect x="340" y="72" width="3" height="3" class="p-muted"/>
    <rect x="337" y="75" width="3" height="3" class="p-muted"/>
    <rect x="343" y="75" width="3" height="3" class="p-muted"/>
    <rect x="340" y="78" width="3" height="3" class="p-muted"/>
  </g>

  <g class="t-2">
    <rect x="500" y="85" width="3" height="3" class="p-cream"/>
    <rect x="500" y="82" width="3" height="3" class="p-accent"/>
    <rect x="497" y="85" width="3" height="3" class="p-accent"/>
    <rect x="503" y="85" width="3" height="3" class="p-accent"/>
    <rect x="500" y="88" width="3" height="3" class="p-accent"/>
  </g>

  <!-- Single Pixel Field Stars -->
  <rect x="40" y="90" width="3" height="3" class="p-muted t-2"/>
  <rect x="110" y="95" width="2" height="2" class="p-cream t-4"/>
  <rect x="300" y="25" width="3" height="3" class="p-cream t-1"/>
  <rect x="370" y="45" width="2" height="2" class="p-accent t-3"/>
  <rect x="460" y="40" width="4" height="4" class="p-cream t-2"/>
  <rect x="530" y="15" width="2" height="2" class="p-muted t-4"/>
  <rect x="600" y="95" width="3" height="3" class="p-cream t-1"/>
  <rect x="670" y="90" width="2" height="2" class="p-accent t-3"/>
  <rect x="770" y="80" width="3" height="3" class="p-cream t-2"/>
</svg>
